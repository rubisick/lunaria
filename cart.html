<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panier — Lunaria</title>
  <meta name="description" content="Votre panier Lunaria.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c1722">
  <link rel="icon" href="img/lunaria/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/store.css">
</head>
<body data-page="cart">
<main id="main">
  <section class="page-hero is-compact">
    <div class="footer-sky" aria-hidden="true"></div>
    <div class="wrap">
      <h1>Votre panier</h1>
      <ol class="progress-steps" aria-label="Étapes de la commande">
        <li class="is-on" aria-current="step"><b>1</b>Panier</li>
        <li><b>2</b>Livraison et paiement</li>
        <li><b>3</b>Confirmation</li>
      </ol>
    </div>
  </section>
  <section class="section is-tight">
    <div class="wrap" data-cart-page></div>
  </section>
  <section class="section is-tint" data-cross-section hidden>
    <div class="wrap">
      <div class="section-head" data-reveal><p class="kicker">Pour compléter</p><h2>Vous aimerez aussi</h2></div>
      <div class="grid is-4" data-cross></div>
    </div>
  </section>
</main>

<script src="js/store/products.js"></script>
<script src="js/store/core.js"></script>
